name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The same push also triggers Pages' own branch build when the repository is
      # still set to "Deploy from a branch". Deployments are last-write-wins, so
      # publishing after that build keeps the built app live instead of the raw
      # index.html. Harmless once the Pages source is GitHub Actions.
      - name: Let a branch-based Pages build finish first
        run: sleep 90

      - id: deployment
        uses: actions/deploy-pages@v4
